{{- if .Values.staleAnalyticsData.alertsEnabled -}}
{{- /* Same routing labels as the generic-prometheus-alerts chart, so the HMPPS alert relay bot sends this alert to the channels set for this component on the Developer Portal */ -}}
{{- $environment := default "none" (.Values.global).environment -}}
{{- $alertSeverity := "hmpps_alerts_nonprod" -}}
{{- if has (lower $environment) (list "prod" "production") -}}
{{- $alertSeverity = "hmpps_alerts_prod" -}}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stale-analytics-data
  labels:
    helm.sh/chart: stale-analytics-data
    app.kubernetes.io/name: stale-analytics-data
    app.kubernetes.io/version: "1"
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    prometheus: cloud-platform
    role: alert-rules
spec:
  groups:
    - name: incentives-stale-analytics-data
      rules:
        - alert: stale-analytics-data
          expr: sum(incentives_stale_analytics_data{namespace="{{ .Release.Namespace }}"}) by (table_type) > 0
          annotations:
            message: Analytics source data for table {{ "{{ $labels.table_type }}" }} is more than {{ .Values.staleAnalyticsData.staleAfterDays }} days old
            runbook_url: https://dsdmoj.atlassian.net/wiki/spaces/IT/pages/4086267986/Live+Service+Support
          labels:
            severity: {{ $alertSeverity }}
            application: hmpps-incentives-ui
            businessUnit: hmpps
            environment: {{ $environment }}
{{- end }}
